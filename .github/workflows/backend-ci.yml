name: Backend CI

on:
  push:
    paths: ["backend/**", ".github/workflows/**"]
  pull_request:
    paths: ["backend/**", ".github/workflows/**"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookwise
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: bookwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookwise -d bookwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Export database URLs
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote

          password = quote(os.environ["POSTGRES_PASSWORD"], safe="")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(
                  f"DATABASE_URL=postgresql+psycopg://bookwise:{password}@127.0.0.1:5432/bookwise\n"
              )
              env_file.write(
                  f"TEST_DATABASE_URL=postgresql+psycopg://bookwise:{password}@127.0.0.1:5432/bookwise_test\n"
              )
          PY

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run migrations on empty database
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov-fail-under=85
