[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bookwise-backend"
version = "0.1.0"
description = "BookWise API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.1,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.4,<3",
    "PyJWT>=2.9,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]
known-third-party = ["alembic"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
